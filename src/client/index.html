<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A shared table for building with bricks, alone or together: start a room, leave suggestions for each other, and keep what you made together." />
    <meta name="theme-color" content="#f2f5f8" />
    <title>Brick Commons: a shared building table</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect y='5' width='16' height='11' rx='2' fill='%23e3241b'/%3E%3Crect x='2' y='2' width='4' height='4' rx='1' fill='%23e3241b'/%3E%3Crect x='10' y='2' width='4' height='4' rx='1' fill='%23e3241b'/%3E%3C/svg%3E" />
    <!--
      A plain, static splash (no script, no font, no three.js): the first
      thing a visitor's browser paints, before React or the WebGL bundle
      even start loading. HomeApp.tsx's own React-rendered loading state
      (`.table-loading` in home.css) looks the same, so there is no visible
      swap once React mounts and takes over #home-root; keep the two in
      sync if either changes (ADR 0014, "Loading screen").

      The SVG below is a small, hand-written, lightweight stand-in for the
      one shared emblem (`emblemMark()`/`decorativeEmblemMark()` in
      ui/iso.ts — used everywhere else: the React loading state, dedicated
      pages' header, the table's own brand link, the fallback nav and the
      README header): inlining that generator's full output here would
      cost real first-paint weight for a mark seen once before React
      mounts. Its silhouette (a blue base, two studded red walls with a
      visible gap, a yellow cap brick) must stay visually equivalent; keep
      both in sync if either changes.
    -->
    <style>
      #static-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 0.9rem;
        padding: 5rem 1rem 3rem;
        background: #f2f5f8;
        color: #172b45;
        font: 700 1.1rem/1.2 ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #static-splash p {
        margin: 0;
      }
    </style>
  </head>
  <body class="home">
    <div id="static-splash" aria-hidden="true">
      <svg width="104" height="104" viewBox="0 0 64 64" role="img" aria-label="">
        <!-- a baseplate, two studded walls and a deliberate gap: an
             unfinished house or shared baseplate, not a finished logo -->
        <rect x="4" y="44" width="56" height="11" rx="2" fill="#0065bd" />
        <rect x="9" y="20" width="16" height="24" rx="1.5" fill="#d92328" />
        <circle cx="14" cy="17" r="2.6" fill="#ea262b" />
        <circle cx="20" cy="17" r="2.6" fill="#ea262b" />
        <rect x="39" y="20" width="16" height="24" rx="1.5" fill="#d92328" />
        <circle cx="44" cy="17" r="2.6" fill="#ea262b" />
        <circle cx="50" cy="17" r="2.6" fill="#ea262b" />
        <rect x="27" y="30" width="10" height="8" rx="1.5" fill="#ffd43b" />
        <circle cx="32" cy="27" r="2.3" fill="#ffe27a" />
      </svg>
      <p>Brick Commons</p>
      <p style="font-weight: 600; font-size: 0.92rem; color: #4d5e76">Setting out the table&hellip;</p>
    </div>
    <div id="home-root"></div>
    <!-- with JS disabled the splash above is never removed, so this one
         <noscript> both hides it and shows the full fallback nav -->
    <noscript>
      <style>
        #static-splash {
          display: none;
        }
      </style>
      <main class="fallback">
        <div class="fallback-card">
          <h1>
            <span class="fallback-mark" aria-hidden="true">
              <svg viewBox="0 0 64 64" role="img" aria-label="">
                <rect x="4" y="44" width="56" height="11" rx="2" fill="#0065bd" />
                <rect x="9" y="20" width="16" height="24" rx="1.5" fill="#d92328" />
                <circle cx="14" cy="17" r="2.6" fill="#ea262b" />
                <circle cx="20" cy="17" r="2.6" fill="#ea262b" />
                <rect x="39" y="20" width="16" height="24" rx="1.5" fill="#d92328" />
                <circle cx="44" cy="17" r="2.6" fill="#ea262b" />
                <circle cx="50" cy="17" r="2.6" fill="#ea262b" />
                <rect x="27" y="30" width="10" height="8" rx="1.5" fill="#ffd43b" />
                <circle cx="32" cy="27" r="2.3" fill="#ffe27a" />
              </svg>
            </span>
            Brick Commons
          </h1>
          <p class="fallback-lede">A shared table for building with bricks, alone or with someone else. Building needs JavaScript and WebGL; these pages are where everything lives.</p>
          <ul class="link-list">
            <li><a href="/build/"><span class="link-label">Build or join a room</span></a></li>
            <li><a href="/build/?view=account"><span class="link-label">Sign in or create an account</span></a></li>
            <li><a href="/build/#friends"><span class="link-label">Friends and invitations</span></a></li>
            <li><a href="/build/?view=collection"><span class="link-label">My collection</span></a></li>
            <li><a href="/build/?view=showcase"><span class="link-label">Public showcase</span></a></li>
            <li><a href="/readme/"><span class="link-label">About this project</span></a></li>
          </ul>
          <p class="fallback-note">An independent student project. Not made, sponsored or endorsed by the LEGO Group.</p>
        </div>
      </main>
    </noscript>
    <script type="module" src="./home/main.tsx"></script>
  </body>
</html>
